version: "3.9"

services:

  frontend:
    build:
      context: ./apps/web
    container_name: accountpilot-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./apps/api
    container_name: accountpilot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - qdrant

  worker:
    build:
      context: ./apps/worker
    container_name: accountpilot-worker
    depends_on:
      - backend
      - redis

  postgres:
    image: postgres:16
    container_name: accountpilot-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: accountpilot

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: accountpilot-redis

    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant

    container_name: accountpilot-qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:

  postgres_data:

  qdrant_data: